# Postgres settings for the scale-proof database, rendered by 20-postgres.sh.
# Sizes follow the instance: shared_buffers is 25 percent of RAM and
# effective_cache_size 75 percent, the same rule an RDS parameter group applies.

# Connections. The server listens on the private address only.
listen_addresses = '@@LISTEN_ADDRESS@@'
port = 5432
max_connections = @@MAX_CONNECTIONS@@
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/etc/postgresql/pg_ident.conf'
data_directory = '/var/lib/postgresql/data'
password_encryption = scram-sha-256

# Memory.
shared_buffers = @@SHARED_BUFFERS_MB@@MB
effective_cache_size = @@EFFECTIVE_CACHE_MB@@MB

# Durability: commit waits for the WAL flush, as in the shipped configuration.
synchronous_commit = on
fsync = on
full_page_writes = on

# WAL and checkpoints.
wal_level = replica
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 16GB
min_wal_size = 4GB

# Planner and I/O hints for SSD-class EBS.
random_page_cost = 1.1
effective_io_concurrency = 200

# Observability: statements over 50 ms are logged; pg_stat_statements is loaded.
log_min_duration_statement = 50ms
log_checkpoints = on
log_line_prefix = '%m [%p] %u@%d '
track_io_timing = on
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000
