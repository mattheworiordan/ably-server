# Cluster-mode topology with the NATS bus (DESIGN.md §7.3): one
# PostgreSQL instance as the store, one NATS server as the cross-node
# bus, and three stateless ably-server nodes running --bus=nats.
#
#   docker compose -f bench/docker-compose.nats.yml up --build -d
#   docker compose -f bench/docker-compose.nats.yml down
#
# Host ports are offset from the root docker-compose.yml so both stacks
# can run side by side: nodes on 8181/8182/8183, Postgres on 5433 and
# NATS on 4223 (NATS monitoring stays inside the network). The image
# tag is distinct too, so building this stack never replaces the
# ably-server:local image the root stack uses.

name: ablynats

x-ably-node: &ably-node
  build:
    context: ..
    dockerfile: Dockerfile
  image: ably-server:nats-bus
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    nats:
      condition: service_healthy
  environment:
    ABLY_SERVER_KEYS: app.key:secret
    ABLY_SERVER_POSTGRES_DSN: postgres://ably:ably@postgres:5432/ably?sslmode=disable
  command:
    - --mode=cluster
    - --bus=nats
    - --nats-url=nats://nats:4222
    - --listen=:8080
    - --log-level=info
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:8080/readyz >/dev/null 2>&1 || exit 1"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ably
      POSTGRES_PASSWORD: ably
      POSTGRES_DB: ably
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ably -d ably"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.11-alpine
    # Core NATS only (no JetStream); -m serves /healthz for the check.
    command: ["-m", "8222"]
    ports:
      - "4223:4222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz >/dev/null 2>&1 || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  node1:
    <<: *ably-node
    ports:
      - "8181:8080"

  node2:
    <<: *ably-node
    ports:
      - "8182:8080"

  node3:
    <<: *ably-node
    ports:
      - "8183:8080"
