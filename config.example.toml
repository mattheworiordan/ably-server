# Example ably-server config file (DESIGN.md §9).
#
# Every key below is optional and shown commented-out with its
# hardcoded default. Resolution order across every source, highest
# priority first:
#
#   flag > env > config file > hardcoded default
#
# So a flag always wins, an env var beats this file, and this file
# only supplies a value nothing more specific set.
#
# Pass this file's path via --config (or ABLY_SERVER_CONFIG):
#
#   ably-server --config config.example.toml
#
# All entries in this file are commented out; an all-commented copy
# of this file parses to the same zero-value config as an empty file.

# Storage backend: memory, disk, or cluster (env: ABLY_SERVER_MODE).
# mode = "memory"

# Address for the HTTP/WS listener (env: ABLY_SERVER_LISTEN).
# listen = ":8080"

# Data directory for disk mode, holds the bbolt file (env: ABLY_SERVER_DATA_DIR).
# data-dir = "./data"

# libpq DSN for cluster mode (env: ABLY_SERVER_POSTGRES_DSN). Required
# when --mode=cluster and not supplied by a flag or env var.
# postgres-dsn = "postgres://user:pw@host:5432/db?sslmode=disable"
#
# A comma-separated list of URL-form DSNs shards channels across the
# databases: each channel lives on one of them, chosen by a hash of its
# name. The list's order and length are fixed for the life of the data
# (no resharding); every node must list the same DSNs in the same order.
# See DESIGN.md §6.4.
# postgres-dsn = "postgres://u:pw@db1:5432/ably,postgres://u:pw@db2:5432/ably"

# Cluster-mode cross-node bus (env: ABLY_SERVER_BUS). Postgres stays the
# store with every bus; the bus only decides how a committed message
# reaches the other nodes. See DESIGN.md §7.2.
#   pgnotify  the shipped LISTEN/NOTIFY broker (the default)
#   postgres  per-channel LISTEN; see postgres-notify-mode
#   nats      NATS core pub/sub; needs nats-url
# bus = "pgnotify"

# NATS server URL for bus = "nats"; a comma-separated list of the servers
# of one NATS cluster is accepted (env: ABLY_SERVER_NATS_URL).
# nats-url = "nats://nats1:4222,nats://nats2:4222,nats://nats3:4222"

# Largest encoded message the NATS bus carries inline, in bytes; larger
# ones travel as a pointer that receivers read from Postgres (env:
# ABLY_SERVER_NATS_INLINE_MAX_BYTES).
# nats-inline-max-bytes = 262144

# Notify mode for bus = "postgres" (env:
# ABLY_SERVER_POSTGRES_NOTIFY_MODE): "coalesced" (the default; writes
# commit without NOTIFY and each node sends at most one wake-up per
# channel per window) or "transactional" (one NOTIFY per write, inside
# its transaction).
# postgres-notify-mode = "coalesced"

# Coalescing window for postgres-notify-mode = "coalesced", as a duration
# string: the extra delivery latency a remote subscriber pays in that
# mode (env: ABLY_SERVER_POSTGRES_NOTIFY_WINDOW). A shorter window sends
# more wake-ups and loads Postgres more; under 20ms the server logs a
# warning at startup (DESIGN.md §7.2).
# postgres-notify-window = "50ms"

# Cap on channels pending a coalesced wake-up on one node. A write to a
# further channel is not announced; receivers deliver it on their next
# sweep instead (env: ABLY_SERVER_POSTGRES_NOTIFY_MAX_PENDING).
# postgres-notify-max-pending = 65536

# How often bus = "postgres" or "nats" checks the channels in
# bus-sweep-scope against their committed serial and catches up one that
# fell behind, as a duration string; "0s" means the bus default, 30s
# (env: ABLY_SERVER_BUS_SWEEP_INTERVAL). A message whose bus delivery was
# lost, with no later message on its channel, is delivered at most about
# two intervals late.
# bus-sweep-interval = "0s"

# Which bound channels that sweep reads (env: ABLY_SERVER_BUS_SWEEP_SCOPE):
# "subscribed" (the default; channels with an attachment or a presence
# member on this node) or "bound" (every bound channel, including ones
# bound only by a REST request or not yet evicted after their last
# detach). See DESIGN.md §7.2.
# bus-sweep-scope = "subscribed"

# Cluster mode: how long a channel outside any persisted namespace keeps
# its message log, the continuity window a client can resume across
# (env: ABLY_SERVER_MESSAGE_RETENTION).
# message-retention = "2m"

# Cluster mode: how long a channel in a persisted namespace (see
# [[namespaces]] below) keeps its message log
# (env: ABLY_SERVER_PERSISTED_RETENTION).
# persisted-retention = "24h"

# Cluster mode: leading-edge publish batching (DESIGN.md §6.3). A channel
# always uses the same lane; an idle lane commits a publish at once, and
# publishes arriving during a commit are committed together as the next
# batch. With 0 lanes every publish commits in its own transaction; a 0
# here reads as unset, so turn batching off with --publish-lanes=0 or
# ABLY_SERVER_PUBLISH_LANES=0.
# (env: ABLY_SERVER_PUBLISH_LANES, ABLY_SERVER_PUBLISH_BATCH_MAX,
# ABLY_SERVER_PUBLISH_LINGER_MAX, ABLY_SERVER_PUBLISH_QUEUE_MAX)
# publish-lanes = 4
# publish-batch-max = 200
# publish-linger-max = "5ms"
# publish-queue-max = 10000

# Cluster mode: bind a channel on every REST publish, as before the
# write-only path (env: ABLY_SERVER_PUBLISH_BIND_ON_WRITE). By default a
# REST publish to a channel with no attachment and no presence member on
# the receiving node is stored and announced to the other nodes without
# binding the channel there, and a channel's first publish creates its
# row inside the batch transaction. See DESIGN.md §6.3.
# publish-bind-on-write = false

# Window to disconnect existing connections on SIGTERM, as a duration
# string (env: ABLY_SERVER_SHUTDOWN_GRACE).
# shutdown-grace = "10s"

# Log level: trace, debug, info, warn, or error (env: ABLY_SERVER_LOG_LEVEL).
# log-level = "info"

# Log format: text or json (env: ABLY_SERVER_LOG_FORMAT).
# log-format = "text"

# Address for the pprof debug listener; disabled if unset (env: ABLY_SERVER_DEBUG_LISTEN).
# debug-listen = "127.0.0.1:6060"

# Register the GET/POST /stats compatibility stub used by SDK test
# flows; unregistered (falls through to the Ably-shaped 40400 catch-all)
# by default (env: ABLY_SERVER_ENABLE_STATS_STUB). Sandbox/SDK-suite runs
# enable this so compat suites' stats round-trip doesn't wedge.
# enable-stats-stub = false

# Evict a channel that has had no attachments, no operation in flight
# and no presence members for this long, releasing its storage binding
# (DESIGN.md §5.1). "0s" disables eviction (env:
# ABLY_SERVER_CHANNEL_IDLE_TIMEOUT).
# channel-idle-timeout = "60s"

# Connection layer (DESIGN.md §5.2). Bytes of encoded frames queued for
# one connection before pushes to it wait
# (env: ABLY_SERVER_CONN_OUTBOUND_MAX_BYTES).
# conn-outbound-max-bytes = 1048576

# Deadline for one frame write, and the longest wait for room in a full
# outbound queue, before the client is disconnected as a slow consumer
# (env: ABLY_SERVER_CONN_WRITE_TIMEOUT).
# conn-write-timeout = "10s"

# Per-connection WebSocket read buffer, and the pooled write buffer, in
# bytes (env: ABLY_SERVER_WS_READ_BUFFER_SIZE,
# ABLY_SERVER_WS_WRITE_BUFFER_SIZE).
# ws-read-buffer-size = 1024
# ws-write-buffer-size = 4096

# How long an idle HTTP keep-alive connection is kept open waiting for
# the next request (DESIGN.md §2.2) (env: ABLY_SERVER_HTTP_IDLE_TIMEOUT).
# http-idle-timeout = "120s"

# [[keys]] entries are the only file-tier source of API keys, and the
# only one that can carry a narrowing capability. Each entry is an
# Ably-format key spec plus an optional `capability` — an
# `x-ably-capability`-format JSON object string (DESIGN.md §3.1) that
# scopes what the key grants; omitting it grants the full capability,
# like a --keys flag or ABLY_SERVER_KEYS entry. A malformed capability
# string is a startup error. At least one key must be configured across
# all sources (flag, env, or this file).
#
# [[keys]]
# key = "app.subscriber:s3cr3t"
# capability = '{"chat:*":["subscribe"]}'

# [[namespaces]] entries mirror the Ably test-app-setup post_apps shape:
# a namespace `id` plus feature flags. In cluster mode `persisted = true`
# gives the namespace's channels (names starting "<id>:") the
# persisted-retention above instead of the continuity window. The other
# flags are parsed and recorded but inert.
#
# [[namespaces]]
# id = "persisted"
# persisted = true
# mutableMessages = false
# pushEnabled = false

# [[channels]] entries seed presence members at startup, before the
# listener opens, via the normal StorePresence path (static membership
# fixtures, DESIGN.md §12.5) — replacing the retired --fixtures JSON
# path. A channel with no `name` or a member with no `clientId` is a
# startup error. `data`/`encoding` round-trip verbatim; encoding is
# opaque and never decoded, so a cipher payload is seeded exactly as
# given.
#
# [[channels]]
# name = "persisted:presence_fixtures"
#
#   [[channels.presence]]
#   clientId = "client_string"
#   data = "This is a string clientData payload"
#   encoding = ""
